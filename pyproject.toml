[project]
name = "aar-agent"
version = "0.4.1.dev0"
description = "Aar — Adaptive Action & Reasoning Agent framework"
readme = "README.md"
requires-python = ">=3.12.2"
dependencies = [
    "pydantic>=2.12.5",
    "httpx>=0.28.1",
    "typer>=0.26.0",
    "rich>=14.3.4",
    "textual>=8.2.3",
	"textual-speedups==0.2.1",
    "jsonschema>=4.18",
    "attrs>=22.2",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project.optional-dependencies]
anthropic = ["anthropic>=0.94.0"]
openai = ["openai>=2.31.0"]
ollama = ["httpx>=0.28.1"]
generic = ["httpx>=0.28.1"]
gemini = ["google-genai>=1.0.0", "httpx>=0.28.1"]
mcp = ["mcp<2.0"]
acp = ["agent-client-protocol>=0.10.0"]
serve = ["uvicorn>=0.34.0"]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.10",
]
all = ["anthropic>=0.94.0", "openai>=2.31.0", "httpx>=0.28.1", "google-genai>=1.0.0", "mcp<2.0", "agent-client-protocol>=0.10.0", "uvicorn>=0.34.0"]

[project.scripts]
aar = "agent.transports.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.hatch.build.targets.wheel.force-include]
# `aar init` reads these at runtime to seed ~/.aar/. Without the force-include
# they are absent from a pip-installed wheel and init silently skips writing
# ~/.aar/rules.md and ~/.aar/config.example.json.
"config/distros" = "agent/data/distros"
"config/rules" = "agent/data/rules"
"config/samples" = "agent/data/samples"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Only collect the core agent test suite by default. The subprojects under
# `aar-extensions-registry/` and `tools/` ship their own tests and dependencies
# and are opt-in: run them explicitly, e.g.
#   pytest aar-extensions-registry/packages/aar-ext-usage-tracker/tests
testpaths = ["tests"]
norecursedirs = [
    ".agent",
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    "aar-extensions-registry",
    "dist",
    "tools",
]
